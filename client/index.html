<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // No-flash theme bootstrap: apply stored theme before first paint. Dark by default.
      (function () {
        try {
          var t = localStorage.getItem("sv_theme") || "dark";
          var h = document.documentElement;
          h.classList.remove("dark", "light");
          h.classList.add(t === "light" ? "light" : "dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
